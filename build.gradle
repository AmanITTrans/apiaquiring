plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.5'
	id 'io.spring.dependency-management' version '1.1.6'
	id 'org.graalvm.buildtools.native' version '0.10.3'
}

group = 'apiAquiring'
version = '1.0.1'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-web-services'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation group: 'io.swagger.core.v3', name: 'swagger-annotations', version: '2.2.25'

	runtimeOnly 'com.h2database:h2'

	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'io.projectreactor:reactor-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	implementation 'net.sf.json-lib:json-lib:2.4:jdk15'
	implementation 'commons-codec:commons-codec:1.15'
	implementation 'org.springdoc:springdoc-openapi-ui:1.7.0'
	implementation 'commons-httpclient:commons-httpclient:3.1'
	implementation 'com.google.guava:guava:31.1-jre'
	implementation 'org.springframework.boot:spring-boot-starter-amqp:3.3.4'
	implementation "org.springframework.boot:spring-boot-starter-mail"
	implementation 'org.springframework.boot:spring-boot-starter-aop'
	implementation 'net.coobird:thumbnailator:0.4.19'
	implementation 'software.amazon.awssdk:s3:2.29.43'
	implementation 'org.apache.httpcomponents.client5:httpclient5:5.3.1'
	implementation 'org.apache.tika:tika-core:3.2.0'
	implementation 'org.apache.tika:tika-parsers:3.2.0'
	implementation 'io.github.bonigarcia:webdrivermanager:5.7.0'
	implementation 'org.seleniumhq.selenium:selenium-java:4.35.0'
	implementation 'com.konghq:unirest-java:3.14.5'
	implementation 'org.jboss.logging:jboss-logging:3.5.3.Final'
	runtimeOnly("io.netty:netty-resolver-dns-native-macos:4.1.118.Final:osx-aarch_64")
}

configurations.all {
	exclude group: 'com.fasterxml.jackson.module', module: 'jackson-module-jaxb-annotations'
}

//hibernate {
//	enhancement {
//		enableAssociationManagement = true
//	}
//}

tasks.named('test') {
	useJUnitPlatform()
}
